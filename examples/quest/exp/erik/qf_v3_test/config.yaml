# Test-only config for the qf_v3 experiments; pick the test set on the command line, e.g.
#   python test.py erik/qf_v3_test --dataset.name qf_v3_logical_test_n_qf_v3_logical_train.data --model_path exp/erik/qf_v3_logical/model.pth
dataset:
  name: null
  split_ratio: [0.0, 0.0, 1.0]  # all for test

model:
  name: simple
  use_only_global: False
  use_global_features: True
  use_gate_type: True
  use_qubit_index: True
  use_T1T2: True
  use_gate_error: True
  use_gate_index: True
  num_layers: 2

criterion:
  name: mse

pdb: False

device: cpu
